services:
  - type: web
    name: fotoboo
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: WEB_DIR
        value: /app/web
      - key: STORAGE_PATH
        value: /tmp/photos
      - key: DB_PATH
        value: /tmp/fotoboo.db
      - key: USE_MINIO
        value: "false"
