<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Camera Icon (centered, large) -->
  <g transform="translate(600, 260)">
    <!-- Camera body -->
    <rect x="-80" y="-35" width="160" height="110" rx="20" ry="20" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9"/>
    <!-- Viewfinder bump -->
    <rect x="-25" y="-55" width="50" height="25" rx="6" ry="6" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
    <!-- Lens outer -->
    <circle cx="0" cy="20" r="40" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9"/>
    <!-- Lens inner -->
    <circle cx="0" cy="20" r="28" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5"/>
    <circle cx="-6" cy="14" r="8" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Title -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
    FotoBoo
  </text>

  <!-- Subtitle -->
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#ffffff" opacity="0.8">
    Your Photo Booth Experience
  </text>
</svg>
