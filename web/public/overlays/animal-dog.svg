<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="dogFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A060" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A07840" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="dogEarOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0722B"/>
      <stop offset="100%" stop-color="#6B4C1A"/>
    </linearGradient>
    <linearGradient id="dogEarInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A259"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Face fur base -->
  <ellipse cx="100" cy="120" rx="80" ry="70" fill="url(#dogFur)"/>
  <!-- Left ear -->
  <g transform="translate(25, 110) rotate(-20)">
    <ellipse cx="0" cy="-35" rx="28" ry="50" fill="url(#dogEarOuter)"/>
    <ellipse cx="0" cy="-30" rx="16" ry="32" fill="url(#dogEarInner)"/>
  </g>
  <!-- Right ear -->
  <g transform="translate(175, 110) rotate(20)">
    <ellipse cx="0" cy="-35" rx="28" ry="50" fill="url(#dogEarOuter)"/>
    <ellipse cx="0" cy="-30" rx="16" ry="32" fill="url(#dogEarInner)"/>
  </g>
  <!-- Eyebrows -->
  <ellipse cx="72" cy="88" rx="14" ry="5" fill="#8B6914" opacity="0.6"/>
  <ellipse cx="128" cy="88" rx="14" ry="5" fill="#8B6914" opacity="0.6"/>
  <!-- Nose -->
  <ellipse cx="100" cy="118" rx="12" ry="9" fill="#3D2B1F"/>
  <ellipse cx="100" cy="116" rx="5" ry="3" fill="#5C4033"/>
  <!-- Mouth -->
  <path d="M100,127 L100,140" stroke="#5C4033" stroke-width="1.5"/>
  <path d="M88,133 Q100,145 112,133" fill="none" stroke="#5C4033" stroke-width="1.2"/>
  <!-- Tongue -->
  <ellipse cx="100" cy="142" rx="8" ry="10" fill="#FF8DA1"/>
  <line x1="100" y1="135" x2="100" y2="150" stroke="#E07080" stroke-width="1" opacity="0.5"/>
</svg>
