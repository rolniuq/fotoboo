<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="pandaFur" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F5F5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E0E0E0" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="pandaEar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D3D3D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </radialGradient>
    <radialGradient id="pandaEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
  </defs>
  <!-- Face fur base -->
  <ellipse cx="100" cy="120" rx="80" ry="70" fill="url(#pandaFur)"/>
  <!-- Left ear -->
  <circle cx="25" cy="55" r="28" fill="url(#pandaEar)"/>
  <!-- Right ear -->
  <circle cx="175" cy="55" r="28" fill="url(#pandaEar)"/>
  <!-- Left eye patch -->
  <ellipse cx="72" cy="100" rx="25" ry="22" fill="#1A1A1A" opacity="0.85"/>
  <ellipse cx="72" cy="100" rx="12" ry="14" fill="url(#pandaEye)"/>
  <circle cx="72" cy="95" r="4" fill="white" opacity="0.8"/>
  <!-- Right eye patch -->
  <ellipse cx="128" cy="100" rx="25" ry="22" fill="#1A1A1A" opacity="0.85"/>
  <ellipse cx="128" cy="100" rx="12" ry="14" fill="url(#pandaEye)"/>
  <circle cx="128" cy="95" r="4" fill="white" opacity="0.8"/>
  <!-- Nose -->
  <ellipse cx="100" cy="122" rx="7" ry="5" fill="#1A1A1A"/>
  <!-- Mouth -->
  <path d="M92,128 Q100,134 108,128" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
