<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="foxFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E88530" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D07020" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="foxEarOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E88530"/>
      <stop offset="100%" stop-color="#FFA040"/>
    </linearGradient>
    <linearGradient id="foxEarInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFD6B0"/>
      <stop offset="100%" stop-color="#FFE8D0"/>
    </linearGradient>
  </defs>
  <!-- Face fur base -->
  <ellipse cx="100" cy="125" rx="70" ry="60" fill="url(#foxFur)"/>
  <!-- White cheeks -->
  <ellipse cx="100" cy="130" rx="50" ry="40" fill="white" opacity="0.4"/>
  <!-- Left ear -->
  <polygon points="15,130 50,5 85,90" fill="url(#foxEarOuter)" stroke="#C06020" stroke-width="1.5"/>
  <polygon points="35,100 50,20 68,80" fill="url(#foxEarInner)"/>
  <!-- Right ear -->
  <polygon points="115,90 150,5 185,130" fill="url(#foxEarOuter)" stroke="#C06020" stroke-width="1.5"/>
  <polygon points="132,80 150,20 165,100" fill="url(#foxEarInner)"/>
  <!-- Pointed snout -->
  <polygon points="72,115 100,150 128,115" fill="white" opacity="0.6"/>
  <!-- Nose -->
  <ellipse cx="100" cy="113" rx="6" ry="4" fill="#3D2B1F"/>
  <!-- Mouth -->
  <path d="M94,118 Q100,123 100,118 Q100,123 106,118" fill="none" stroke="#3D2B1F" stroke-width="1"/>
  <!-- Whiskers -->
  <line x1="100" y1="120" x2="25" y2="110" stroke="#AAA" stroke-width="0.8" opacity="0.6"/>
  <line x1="100" y1="123" x2="20" y2="125" stroke="#AAA" stroke-width="0.8" opacity="0.6"/>
  <line x1="100" y1="120" x2="175" y2="110" stroke="#AAA" stroke-width="0.8" opacity="0.6"/>
  <line x1="100" y1="123" x2="180" y2="125" stroke="#AAA" stroke-width="0.8" opacity="0.6"/>
</svg>
