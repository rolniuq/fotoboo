<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Left lens -->
  <rect x="8" y="20" width="82" height="58" rx="12" fill="#1A1A1A" stroke="#2C2C2C" stroke-width="3"/>
  <!-- Right lens -->
  <rect x="110" y="20" width="82" height="58" rx="12" fill="#1A1A1A" stroke="#2C2C2C" stroke-width="3"/>
  <!-- Bridge -->
  <path d="M90,48 Q100,40 110,48" fill="none" stroke="#2C2C2C" stroke-width="4"/>
  <!-- Left arm -->
  <line x1="0" y1="42" x2="8" y2="43" stroke="#2C2C2C" stroke-width="4" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="192" y1="42" x2="200" y2="43" stroke="#2C2C2C" stroke-width="4" stroke-linecap="round"/>
  <!-- Shine -->
  <rect x="15" y="28" width="30" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="117" y="28" width="30" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
  <!-- Nose pads -->
  <line x1="90" y1="56" x2="96" y2="64" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="56" x2="104" y2="64" stroke="#555" stroke-width="2" stroke-linecap="round"/>
</svg>
