<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8899ff"/>
      <stop offset="100%" stop-color="#553388"/>
    </linearGradient>
  </defs>

  <!-- Camera Body -->
  <rect x="10" y="28" width="80" height="58" rx="12" ry="12" fill="url(#bg)"/>

  <!-- Top Flash / Viewfinder bump -->
  <rect x="38" y="18" width="24" height="14" rx="4" ry="4" fill="url(#bg)"/>
  <circle cx="50" cy="25" r="4" fill="#ff1744" opacity="0.9"/>

  <!-- Lens Outer Ring -->
  <circle cx="50" cy="57" r="22" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
  <circle cx="50" cy="57" r="18" fill="url(#lens)" opacity="0.9"/>

  <!-- Lens Inner -->
  <circle cx="50" cy="57" r="10" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <circle cx="48" cy="55" r="4" fill="#ffffff" opacity="0.3"/>

  <!-- Viewfinder -->
  <rect x="70" y="22" width="10" height="8" rx="2" ry="2" fill="#ffffff" opacity="0.3"/>
</svg>
