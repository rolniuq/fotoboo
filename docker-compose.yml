name: fotoboo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fotoboo-api
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      WEB_DIR: /app/web
      DB_PATH: /app/data/fotoboo.db
      STORAGE_PATH: /app/data/photos
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      USE_MINIO: ${USE_MINIO:-false}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-fotoboo}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    volumes:
      - fotoboo_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    container_name: fotoboo-caddy
    profiles:
      - prod
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-ops@example.com}
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fotoboo-minio
    profiles:
      - minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  fotoboo_data:
  minio_data:
  caddy_data:
  caddy_config:
